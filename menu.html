<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu — Villa Rasamala</title>
<link rel="icon" type="image/x-icon" href="images/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Parisienne&family=Public+Sans:wght@300;400;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin:0; padding:0; }
:root {
  --cream: #FBF7EE;
  --olive: #32372C;
  --carbon: #121314;
  --grey: #6B6F68;
  --gold: #B8952A;
  --gold-light: #D4B060;
  --cream-dark: #EDE7D8;
  --olive-soft: #4A5044;
  --border: rgba(50,55,44,0.15);
}
body {
  font-family: 'Public Sans', sans-serif;
  background: var(--cream);
  color: var(--carbon);
  font-weight: 300;
  line-height: 1.7;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding: 2.5rem 1.2rem;
}
.menu-wrap { max-width: 500px; width:100%; }
.menu-card {
  background:#fff;
  border:1px solid var(--border);
  border-radius:18px;
  overflow:hidden;
  box-shadow: 0 10px 40px rgba(50,55,44,0.08);
}
.menu-head {
  background: linear-gradient(135deg, var(--olive), var(--olive-soft));
  color: var(--cream);
  padding: 2.5rem 2rem 2rem;
  text-align:center;
}
.menu-logo {
  font-family:'Cormorant Garamond', serif; font-weight:500;
  font-size:2.2rem; line-height:1.15; margin-bottom:.5rem;
}
.menu-sub { font-size:12.5px; color: rgba(251,247,238,0.75); font-weight:300; }
.menu-body { padding: 2.2rem 2rem; }
.menu-intro {
  text-align:center; font-size:13px; color: var(--grey); margin-bottom:2rem; line-height:1.7;
}
.menu-buttons { display:flex; flex-direction:column; gap:1.2rem; }
.menu-btn {
  padding:1.2rem; border:none; border-radius:12px;
  font-family:'Public Sans',sans-serif; font-size:15px; font-weight:700;
  letter-spacing:.02em; cursor:pointer;
  transition: all .2s;
  text-decoration:none;
  display:flex; align-items:center; justify-content:center; gap:.6rem;
}
.menu-btn.primary {
  background: var(--gold);
  color: var(--carbon);
}
.menu-btn.primary:hover { background: var(--gold-light); }
.menu-btn.secondary {
  background: var(--cream-dark);
  color: var(--olive);
  border:1px solid var(--border);
}
.menu-btn.secondary:hover { background: var(--cream); border-color: var(--olive); }
.menu-btn:active { transform: scale(0.98); }
.menu-icon { font-size:18px; }
.menu-footer {
  text-align:center; padding-top:1.5rem; border-top:1px solid var(--border);
  margin-top:1.5rem; font-size:11px; color: var(--grey);
}
@media (max-width:480px){
  .menu-head { padding:2rem 1.4rem 1.6rem; }
  .menu-logo { font-size:1.8rem; }
  .menu-body { padding:1.8rem 1.4rem; }
  .menu-btn { padding:1rem; font-size:14px; }
}
</style>
</head>
<body>

<div class="menu-wrap">
  <div class="menu-card">
    <div class="menu-head">
      <div class="menu-logo">Villa Rasamala</div>
      <div class="menu-sub">Depok, Sleman, Yogyakarta</div>
    </div>
    <div class="menu-body">
      <div class="menu-intro">
        Pilih apa yang ingin kamu lakukan:
      </div>
      <div class="menu-buttons">
        <a href="index.html" class="menu-btn primary">
          <span class="menu-icon">🏡</span>
          Beranda
        </a>
        <a href="voucher.html" class="menu-btn secondary">
          <span class="menu-icon">🎟️</span>
          Klaim Voucher Diskon
        </a>
      </div>
      <div class="menu-footer">
        <a href="https://wa.me/62882008364644" target="_blank" style="color:var(--olive); text-decoration:none; font-weight:600;">Hubungi via WhatsApp</a>
      </div>
    </div>
  </div>
</div>

</body>
</html>
